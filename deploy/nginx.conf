server {
    listen 8080;
    server_name _;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass http://api:3000;
    }

    # Browsers revalidate site responses so a switched release is seen on reload.
    location / {
        root /output/current;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ @no_release;
    }

    location @no_release {
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache" always;
        return 503 "Site build pending\n";
    }
}
