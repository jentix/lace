services:
  minio:
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${LACE_MINIO_ROOT_SECRET:?set LACE_MINIO_ROOT_SECRET}
      MINIO_ROOT_USER: ${LACE_MINIO_ROOT_ACCESS_KEY:?set LACE_MINIO_ROOT_ACCESS_KEY}
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 5s
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/minio/health/live"]
      timeout: 3s
    image: minio/minio:latest
    ports:
      - "${LACE_MINIO_PORT:-9000}:9000"
      - "${LACE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    command:
      [
        "sh",
        "-ec",
        'mc alias set local http://minio:9000 "$${LACE_MINIO_ROOT_ACCESS_KEY}" "$${LACE_MINIO_ROOT_SECRET}" && mc mb --ignore-existing local/$${LACE_MINIO_BUCKET}',
      ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LACE_MINIO_BUCKET: ${LACE_MINIO_BUCKET:?set LACE_MINIO_BUCKET}
      LACE_MINIO_ROOT_ACCESS_KEY: ${LACE_MINIO_ROOT_ACCESS_KEY:?set LACE_MINIO_ROOT_ACCESS_KEY}
      LACE_MINIO_ROOT_SECRET: ${LACE_MINIO_ROOT_SECRET:?set LACE_MINIO_ROOT_SECRET}
    image: minio/mc:latest
    restart: "no"

volumes:
  minio-data:
