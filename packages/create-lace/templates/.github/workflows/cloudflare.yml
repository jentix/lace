name: Deploy site to Cloudflare Pages
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          LACE_API_BASE_URL: ${{ vars.LACE_API_BASE_URL }}
          LACE_PUBLIC_BASE_URL: ${{ vars.LACE_PUBLIC_BASE_URL }}
          LACE_BUILD_TOKEN: ${{ secrets.LACE_BUILD_TOKEN }}
      - run: pnpm exec wrangler pages deploy site/dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
